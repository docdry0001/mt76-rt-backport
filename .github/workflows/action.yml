name: Build mt76 module for OnePlus SM8475 (Professional Edition)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. Հիմնական կախվածություններ ---
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-aarch64-linux-gnu bc flex bison libssl-dev \
            libelf-dev git wget kmod cpio xz-utils python3 clang lld llvm
          sudo rm -rf /var/lib/apt/lists/*

      # --- 2. Repo-ի տեղադրում (կրիտիկական) ---
      - name: Install repo tool manually
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Configure git
        run: |
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Builder"

      # --- 3. Manifest-ի և Kernel-ի սինխրոնիզացիա ---
      - name: Sync kernel source using repo
        run: |
          # Ստեղծել manifest.xml
          cat > /tmp/default.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote fetch="https://git.codelinaro.org/clo/la" name="clo" review="codelinaro.org"/>
            <remote fetch="https://github.com/OnePlusOSS" name="origin"/>
            <default remote="clo" revision="kernel.build.lnx.1.0" sync-j="8"/>
            <project remote="origin" name="android_kernel_common_oneplus_sm8475" path="kernel_platform/common" revision="oneplus/sm8475_b_16.0.0_oneplus_11r"/>
            <project remote="origin" name="android_kernel_oneplus_sm8475" path="kernel_platform/msm-kernel" revision="oneplus/sm8475_b_16.0.0_oneplus_11r">
              <linkfile dest="kernel_platform/common/build.config.msm.waipio" src="build.config.msm.waipio"/>
              <linkfile dest="kernel_platform/common/build.config.msm.waipio.tuivm" src="build.config.msm.waipio.tuivm"/>
              <linkfile dest="kernel_platform/common/build.config.msm.lahaina" src="build.config.msm.lahaina"/>
            </project>
            <project remote="origin" name="android_kernel_modules_and_devicetree_oneplus_sm8475" path="./" revision="oneplus/sm8475_b_16.0.0_oneplus_11r"/>
            <!-- Պահպանել բոլոր prebuilts-ները -->
            <project remote="clo" name="kernel/prebuilts/build-tools" path="kernel_platform/prebuilts/kernel-build-tools" revision="10ab783184f77d3ea15bf666426a7138b0f62bfc" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
            <project remote="clo" name="kernel_platform/external/dtc" revision="deb932d81061c472e8bb2648a409a456e6e84997" upstream="refs/heads/kernel.build.lnx.1.0.r1-rel"/>
            <project remote="clo" name="kernel_platform/kernel/prebuilts/mainline/arm64" revision="de12e10cfe8d67d5c0627069306fda939f52154a" upstream="refs/heads/kernel.lnx.5.10.r1-rel"/>
            <project remote="clo" name="kernel_platform/prebuilts/build-tools" revision="846214bd11004546cd3fc2590c73c628fcd6778c" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
            <project remote="clo" name="kernel_platform/system/tools/mkbootimg" path="kernel_platform/tools/mkbootimg" revision="08410f46318f3f301b96ed058466ab0dde0b050b" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
            <project remote="clo" name="kernelplatform/prebuilts-master/clang/host/linux-x86" path="kernel_platform/prebuilts-master/clang/host/linux-x86" revision="0fc3d01a780023469b7acc18c56a9cf5099a6d6c" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
            <project remote="clo" name="kernelplatform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8" path="kernel_platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8" revision="c9f87ae369034b4942536a1c5bd62e4cd1d828e3" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
          </manifest>
          EOF

          # Manifest-ը դարձնել Git ռեպո
          mkdir -p /tmp/manifest-repo
          cd /tmp/manifest-repo
          cp /tmp/default.xml .
          git init
          git add default.xml
          git commit -m "Init manifest"

          # Repo init և sync
          cd $GITHUB_WORKSPACE
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u file:///tmp/manifest-repo --no-clone-bundle --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

      # --- 4. Mt76 սկզբնակոդ ---
      - name: Clone OpenWrt mt76 source
        run: |
          git clone --depth 1 -b master https://github.com/openwrt/mt76.git mt76-openwrt
          cd mt76-openwrt
          git fetch --depth 1 origin bdf8ea71700746c634c064d6477aa143f821d6f6
          git checkout bdf8ea71700746c634c064d6477aa143f821d6f6

      # --- 5. Ախտորոշում և անհրաժեշտ ֆայլերի ստուգում ---
      - name: Prepare kernel config and headers with diagnostics
        run: |
          KERNEL_DIR=kernel_workspace/kernel_platform/msm-kernel
          
          # Ստուգել և պատճենել կոնֆիգը
          if [ ! -f config ]; then
            echo "⚠️ WARNING: config ֆայլը բացակայում է repository-ում:"
          else
            cp config "$KERNEL_DIR/.config"
            echo "✅ config պատճենված է"
          fi
          
          # Ստեղծել թղթապանակներ
          mkdir -p "$KERNEL_DIR/include/linux/soc/mediatek"
          
          # Ստուգել և պատճենել mtk_wed.h
          if [ ! -f mtk_wed.h ]; then
            echo "⚠️ WARNING: mtk_wed.h բացակայում է: Ստեղծում ենք դատարկը..."
            echo "#ifndef __MTK_WED_H" > "$KERNEL_DIR/include/linux/soc/mediatek/mtk_wed.h"
            echo "#define __MTK_WED_H" >> "$KERNEL_DIR/include/linux/soc/mediatek/mtk_wed.h"
            echo "#endif" >> "$KERNEL_DIR/include/linux/soc/mediatek/mtk_wed.h"
          else
            cp mtk_wed.h "$KERNEL_DIR/include/linux/soc/mediatek/mtk_wed.h"
            echo "✅ mtk_wed.h պատճենված է"
          fi
          
          # Ստուգել Module.symvers
          if [ -f Module.symvers ]; then
            cp Module.symvers "$KERNEL_DIR/Module.symvers"
            echo "✅ Module.symvers պատճենված է"
          else
            echo "⚠️ Module.symvers բացակայում է: Կառուցումը կփորձի նոր ստեղծել:"
          fi
          
          # Ստուգել compat-5.10.h
          if [ -f compat-5.10.h ]; then
            cp compat-5.10.h /tmp/compat-5.10.h
            echo "✅ compat-5.10.h պատճենված է"
          else
            echo "ℹ️ compat-5.10.h բացակայում է, կանցնենք առանց դրա"
          fi

      # --- 6. Kernel headers պատրաստում ---
      - name: Prepare kernel headers
        working-directory: kernel_workspace/kernel_platform/msm-kernel
        run: |
          export PATH="$PWD/../prebuilts-master/clang/host/linux-x86/clang-r383902b/bin:$PATH"
          export PATH="$PWD/../prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Հեռացնել խնդրահարույց Kconfig
          if grep -q "kernel/oplus_cpu/sched/Kconfig" init/Kconfig; then
            sed -i 's|^source "kernel/oplus_cpu/sched/Kconfig"|#source "kernel/oplus_cpu/sched/Kconfig"|' init/Kconfig
            echo "⚠️ Kconfig-ում անջատել ենք բացակայող oplus_cpu հղումը:"
          fi
          
          # Ստեղծել կոնֆիգուրացիա
          make ARCH=arm64 LLVM=1 olddefconfig || true
          
          # Ստեղծել մոդուլների նախապատրաստություն
          make ARCH=arm64 LLVM=1 modules_prepare || true
          
          echo "Kernel headers պատրաստ է:"

      # --- 7. MT76 source կոպիավորում ---
      - name: Copy mt76 source
        run: cp -r mt76-openwrt mt76-src

      # --- 8. Patches (մնում է նույնը) ---
      - name: Apply compatibility patches to mt76
        working-directory: mt76-src
        run: |
          sed -i 's/netif_napi_add_tx(/netif_tx_napi_add(/g' $(grep -rl 'netif_napi_add_tx' . 2>/dev/null) 2>/dev/null || true
          sed -i 's/#include <linux\/soc\/mediatek\/mtk_wed.h>//' mt76.h 2>/dev/null || true
          sed -i '/#ifndef __MT76_H/a #include <linux/soc/mediatek/mtk_wed.h>' mt76.h 2>/dev/null || true
          # ... Ձեր բոլոր մյուս sed հրամանները նույնն են ...
          sed -i '/\.set_sar_specs/d' mt7921/main.c 2>/dev/null || true
          sed -i '/\.sta_set_decap_offload/d' mt7921/main.c 2>/dev/null || true
          sed -i '/\.net_fill_forward_path/d' mt7921/main.c 2>/dev/null || true
          sed -i 's/ieee80211_is_bufferable_mmpdu(skb)/mt76_compat_is_bufferable_mmpdu(skb)/g' tx.c 2>/dev/null || true
          sed -i '/of_get_mac_address/s/^/\/\//' eeprom.c 2>/dev/null || true
          sed -i '/\.threaded\s*=/d' dma.c 2>/dev/null || true
          sed -i 's/wiphy->mbssid_max_interfaces/1/g' mt76_connac_mcu.c 2>/dev/null || true
          sed -i 's/wiphy->mbssid_max_ema_profile_periodicity/1/g' mt76_connac_mcu.c 2>/dev/null || true
          sed -i '/wiphy->sar_capa\s*=/d' mac80211.c mt7921/init.c 2>/dev/null || true
          sed -i 's/wiphy->sar_capa->num_freq_ranges/mt76_sar_capa.num_freq_ranges/g' mac80211.c 2>/dev/null || true
          sed -i 's/phy->hw->wiphy->sar_capa/\&mt76_sar_capa/g' mac80211.c 2>/dev/null || true
          sed -i 's/hw->wiphy->sar_capa/\&mt76_sar_capa/g' mac80211.c 2>/dev/null || true
          sed -i '/set_current_state(TASK_INTERRUPTIBLE)/d' util.c
          sed -i 's/set_current_state(TASK_RUNNING)/__set_current_state(TASK_RUNNING)/' util.c
          sed -i '/test_and_clear_bit(MT76_WORKER_SCHEDULED/{n;s/schedule();/usleep_range(50, 500);/}' util.c

      # --- 9. Մոդուլի կառուցում (V=1 ավելացված է ախտորոշման համար) ---
      - name: Build mt76 module (verbose output)
        run: |
          KERNEL_DIR=kernel_workspace/kernel_platform/msm-kernel
          export PATH="$KERNEL_DIR/../prebuilts-master/clang/host/linux-x86/clang-r383902b/bin:$PATH"
          export PATH="$KERNEL_DIR/../prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Ստուգել, արդյոք մենք ունենք կառուցման ֆայլեր
          if [ ! -f "$KERNEL_DIR/.config" ]; then
            echo "❌ Սխալ: .config ֆայլը բացակայում է $KERNEL_DIR-ում:"
            exit 1
          fi

          # compat-5.10.h ֆլագ
          COMPAT_FLAG=""
          [ -f /tmp/compat-5.10.h ] && COMPAT_FLAG="-include /tmp/compat-5.10.h"

          # MAKE հրաման (V=1 -> կցուցադրի ամբողջական ելք)
          make -C "$KERNEL_DIR" M=$PWD/mt76-src \
            ARCH=arm64 LLVM=1 \
            EXTRA_CFLAGS="$COMPAT_FLAG" \
            KCFLAGS="-Wno-error" \
            V=1 \
            CONFIG_MT76_USB=m \
            CONFIG_MT76_SDIO= \
            CONFIG_MT76_CONNAC_LIB=m \
            CONFIG_MT7921_COMMON=m \
            CONFIG_MT7921U=m \
            CONFIG_MT7921E= \
            CONFIG_MT7921S= \
            CONFIG_MT76x0_COMMON= \
            CONFIG_MT76x2_COMMON= \
            CONFIG_MT7603E= \
            CONFIG_MT7615_COMMON= \
            CONFIG_MT7915E= \
            CONFIG_MT7996E= \
            modules -j$(nproc)

      # --- 10. Կառուցված ֆայլեր ---
      - name: Collect built modules
        run: |
          mkdir -p output
          find mt76-src -name "*.ko" -exec cp {} output/ \;
          ls -la output/

      - name: Patch CRCs if needed
        run: |
          if [ -f patch_versions.py ] && [ -f Module.symvers ]; then
            python3 patch_versions.py output Module.symvers || echo "Patch failed"
          else
            echo "Skipping CRC patching"
          fi

      - name: Verify modules
        run: |
          for ko in output/*.ko; do
            echo "=== $ko ==="
            modinfo "$ko" | grep -E "vermagic|depends" || true
            aarch64-linux-gnu-objdump -h "$ko" 2>/dev/null | grep __versions || echo "No __versions"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt76-modules
          path: output/*.ko
