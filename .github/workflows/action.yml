name: Build mt76 module for OnePlus SM8475 kernel

on:
  workflow_dispatch:  # manual trigger
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bc \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            kmod \
            cpio \
            xz-utils \
            python3 \
            clang \
            lld \
            llvm
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone OnePlus kernel
        run: |
          git clone --depth 1 --single-branch \
            --branch oneplus/sm8475_b_16.0.0_oneplus_11r \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8475.git \
            oneplus-kernel

      - name: Clone OpenWrt mt76 source
        run: |
          git clone --depth 1 -b master https://github.com/openwrt/mt76.git mt76-openwrt
          cd mt76-openwrt
          git fetch --depth 1 origin bdf8ea71700746c634c064d6477aa143f821d6f6
          git checkout bdf8ea71700746c634c064d6477aa143f821d6f6

      - name: Copy kernel config and headers
        run: |
          # Եթե config, mtk_wed.h, Module.symvers, compat-5.10.h, patch_versions.py
          # կան repository-ի արմատում, պատճենել դրանք
          # Հակառակ դեպքում, այս քայլը կձախողվի – համոզվիր, որ ֆայլերը կան
          cp config oneplus-kernel/.config
          cp mtk_wed.h oneplus-kernel/include/linux/soc/mediatek/mtk_wed.h
          cp Module.symvers oneplus-kernel/Module.symvers
          cp compat-5.10.h /tmp/compat-5.10.h
          # patch_versions.py կօգտագործվի հետո

      - name: Prepare kernel headers
        working-directory: oneplus-kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 modules_prepare
          cat include/generated/utsrelease.h

      - name: Copy mt76 source to working directory
        run: cp -r mt76-openwrt mt76-src

      - name: Apply compatibility patches to mt76
        working-directory: mt76-src
        run: |
          # Patch 1
          sed -i 's/netif_napi_add_tx(/netif_tx_napi_add(/g' $(grep -rl 'netif_napi_add_tx' . 2>/dev/null) 2>/dev/null || true
          # Patch 2
          sed -i 's/#include <linux\/soc\/mediatek\/mtk_wed.h>//' mt76.h 2>/dev/null || true
          sed -i '/#ifndef __MT76_H/a #include <linux/soc/mediatek/mtk_wed.h>' mt76.h 2>/dev/null || true
          # Patch 3
          sed -i '/\.set_sar_specs/d' mt7921/main.c 2>/dev/null || true
          # Patch 4
          sed -i '/\.sta_set_decap_offload/d' mt7921/main.c 2>/dev/null || true
          # Patch 5
          sed -i '/\.net_fill_forward_path/d' mt7921/main.c 2>/dev/null || true
          # Patch 6
          sed -i 's/ieee80211_is_bufferable_mmpdu(skb)/mt76_compat_is_bufferable_mmpdu(skb)/g' tx.c 2>/dev/null || true
          # Patch 7
          sed -i '/of_get_mac_address/s/^/\/\//' eeprom.c 2>/dev/null || true
          # Patch 8
          sed -i '/\.threaded\s*=/d' dma.c 2>/dev/null || true
          # Patch 9
          sed -i 's/wiphy->mbssid_max_interfaces/1/g' mt76_connac_mcu.c 2>/dev/null || true
          sed -i 's/wiphy->mbssid_max_ema_profile_periodicity/1/g' mt76_connac_mcu.c 2>/dev/null || true
          # Patch 10
          sed -i '/wiphy->sar_capa\s*=/d' mac80211.c mt7921/init.c 2>/dev/null || true
          sed -i 's/wiphy->sar_capa->num_freq_ranges/mt76_sar_capa.num_freq_ranges/g' mac80211.c 2>/dev/null || true
          sed -i 's/phy->hw->wiphy->sar_capa/\&mt76_sar_capa/g' mac80211.c 2>/dev/null || true
          sed -i 's/hw->wiphy->sar_capa/\&mt76_sar_capa/g' mac80211.c 2>/dev/null || true
          # Patch 11
          sed -i '/set_current_state(TASK_INTERRUPTIBLE)/d' util.c
          sed -i 's/set_current_state(TASK_RUNNING)/__set_current_state(TASK_RUNNING)/' util.c
          sed -i '/test_and_clear_bit(MT76_WORKER_SCHEDULED/{n;s/schedule();/usleep_range(50, 500);/}' util.c
          grep -B2 -A2 "usleep_range" util.c || true

      - name: Build mt76 module
        run: |
          make -C oneplus-kernel M=$PWD/mt76-src \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 \
            EXTRA_CFLAGS="-include /tmp/compat-5.10.h" \
            KCFLAGS="-Wno-error" \
            CONFIG_MT76_USB=m \
            CONFIG_MT76_SDIO= \
            CONFIG_MT76_CONNAC_LIB=m \
            CONFIG_MT7921_COMMON=m \
            CONFIG_MT7921U=m \
            CONFIG_MT7921E= \
            CONFIG_MT7921S= \
            CONFIG_MT76x0_COMMON= \
            CONFIG_MT76x2_COMMON= \
            CONFIG_MT7603E= \
            CONFIG_MT7615_COMMON= \
            CONFIG_MT7915E= \
            CONFIG_MT7996E= \
            modules -j$(nproc) 2>&1 || \
          { echo "Build failed, falling back without Module.symvers"; \
            rm oneplus-kernel/Module.symvers; \
            make -C oneplus-kernel M=$PWD/mt76-src \
              ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 \
              EXTRA_CFLAGS="-include /tmp/compat-5.10.h" \
              KCFLAGS="-Wno-error" \
              CONFIG_MT76_USB=m \
              CONFIG_MT76_SDIO= \
              CONFIG_MT76_CONNAC_LIB=m \
              CONFIG_MT7921_COMMON=m \
              CONFIG_MT7921U=m \
              CONFIG_MT7921E= \
              CONFIG_MT7921S= \
              CONFIG_MT76x0_COMMON= \
              CONFIG_MT76x2_COMMON= \
              CONFIG_MT7603E= \
              CONFIG_MT7615_COMMON= \
              CONFIG_MT7915E= \
              CONFIG_MT7996E= \
              modules -j$(nproc); \
          }

      - name: Collect built modules
        run: |
          mkdir -p output
          find mt76-src -name "*.ko" -exec cp {} output/ \;
          echo "=== Built modules ==="
          ls -la output/

      - name: Patch CRCs if needed
        run: |
          if [ -f patch_versions.py ] && [ -f Module.symvers ]; then
            python3 patch_versions.py output Module.symvers || echo "Patch script failed"
          else
            echo "patch_versions.py or Module.symvers not found, skipping CRC patching"
          fi

      - name: Verify module info
        run: |
          for ko in output/*.ko; do
            echo "=== $ko ==="
            modinfo "$ko" | grep -E "filename|vermagic|depends" || true
            aarch64-linux-gnu-objdump -h "$ko" 2>/dev/null | grep __versions || echo "No __versions section"
          done

      - name: Upload modules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt76-modules
          path: output/*.ko
